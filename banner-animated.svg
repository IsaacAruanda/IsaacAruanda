<svg width="1584" height="640" viewBox="0 0 1584 640" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#02040a"/>
    <stop offset="45%" stop-color="#0a1220"/>
    <stop offset="100%" stop-color="#0b1a30"/>
  </linearGradient>
  <radialGradient id="glowR" cx="86%" cy="18%" r="45%">
    <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#4f9dff"/>
    <stop offset="100%" stop-color="#7dd3fc"/>
  </linearGradient>
  <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#1f6feb" stop-opacity="0"/>
    <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
    <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    <animate attributeName="x1" values="-30%;130%" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0%;160%" dur="3.2s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#1f6feb"/>
    <stop offset="100%" stop-color="#58a6ff"/>
  </linearGradient>
  <style>
    <![CDATA[
      @keyframes twinkle { 0%,100% { opacity:.15 } 50% { opacity:1 } }
      @keyframes drift { 0%,100% { transform:translateY(0px) } 50% { transform:translateY(-8px) } }
      @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes fadeInUp { 0% { opacity:0; transform:translateY(8px) } 100% { opacity:1; transform:translateY(0) } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      .star { animation: twinkle 3.4s ease-in-out infinite; }
      .float { animation: drift 6s ease-in-out infinite; }
      .cursor { animation: blink 1.1s step-start infinite; }
      .node-pulse { animation: pulse 2.6s ease-in-out infinite; }
      .badge { animation: fadeInUp .8s ease-out both; }
      .orbit { transform-origin: 1650px 90px; animation: spin 26s linear infinite; }
      .orbit2 { transform-origin: 1650px 90px; animation: spinRev 34s linear infinite; }
      text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      .mono { font-family: 'Consolas','SF Mono', Monaco, monospace; }
    ]]>
  </style>
</defs>

<!-- background -->
<rect width="1584" height="640" fill="url(#bg)"/>
<rect width="1584" height="640" fill="url(#glowR)"/>

<!-- faint grid -->
<g stroke="#152238" stroke-width="1" opacity="0.55">
  <line x1="0" y1="90" x2="1584" y2="90"/>
  <line x1="0" y1="548" x2="1584" y2="548"/>
</g>

<!-- ambient corner globe (behind everything else in the right column) -->
<g opacity="0.5">
  <circle cx="1650" cy="90" r="230" fill="none" stroke="#1c3050" stroke-width="1"/>
  <g class="orbit">
    <ellipse cx="1650" cy="90" rx="290" ry="90" fill="none" stroke="#213a5c" stroke-width="1"/>
    <circle cx="1360" cy="90" r="3.5" fill="#58a6ff" class="node-pulse"/>
  </g>
  <g class="orbit2">
    <ellipse cx="1650" cy="90" rx="90" ry="290" fill="none" stroke="#213a5c" stroke-width="1"/>
    <circle cx="1650" cy="380" r="3.5" fill="#7dd3fc" class="node-pulse"/>
  </g>
</g>

<!-- twinkling stars / particles -->
<g fill="#7dd3fc">
  <circle class="star" cx="120" cy="40" r="2" style="animation-delay:.1s"/>
  <circle class="star" cx="420" cy="20" r="1.6" style="animation-delay:.6s"/>
  <circle class="star" cx="700" cy="55" r="2" style="animation-delay:1.2s"/>
  <circle class="star" cx="980" cy="30" r="1.6" style="animation-delay:.3s"/>
  <circle class="star" cx="60" cy="260" r="1.6" style="animation-delay:1.6s"/>
  <circle class="star" cx="240" cy="500" r="1.6" style="animation-delay:.9s"/>
  <circle class="star" cx="820" cy="560" r="1.6" style="animation-delay:2s"/>
  <circle class="star" cx="1010" cy="30" r="2" style="animation-delay:.4s"/>
  <circle class="star" cx="1500" cy="470" r="1.6" style="animation-delay:1.1s"/>
</g>

<!-- terminal init line -->
<g class="float">
  <text x="90" y="60" class="mono" font-size="17" fill="#58a6ff">&gt;</text>
  <text x="108" y="60" class="mono" font-size="17" fill="#8b949e">initializing_profile.exe</text>
  <rect x="330" y="47" width="9" height="16" fill="#58a6ff" class="cursor"/>
</g>

<!-- vertical nav ticks -->
<g class="mono" font-size="13" fill="#3b4a63">
  <line x1="40" y1="130" x2="40" y2="330" stroke="#1c2c42" stroke-width="1"/>
  <text x="30" y="150">01</text>
  <text x="30" y="190">02</text>
  <text x="26" y="230" fill="#58a6ff" font-weight="700">03</text>
  <circle cx="40" cy="226" r="3" fill="#58a6ff" class="node-pulse"/>
  <text x="30" y="270">04</text>
  <text x="30" y="310">05</text>
</g>

<!-- main name -->
<text x="90" y="205" font-size="76" font-weight="800" fill="#f0f6fc" letter-spacing="1">ISAAC</text>
<text x="340" y="205" font-size="76" font-weight="800" fill="url(#nameGrad)" letter-spacing="1">ARUANDA</text>

<!-- role with typing cursor -->
<text x="92" y="255" font-size="30" font-weight="600" fill="#c9d1d9" letter-spacing="3">IT SUPPORT ANALYST</text>
<rect x="472" y="232" width="10" height="26" fill="#58a6ff" class="cursor"/>

<!-- keyword line -->
<text x="92" y="295" class="mono" font-size="18" fill="#8b949e" letter-spacing="0.5">PYTHON &#8226; SQL &#8226; AUTOMATION &#8226; POWER BI &#8226; MICROSOFT 365 &#8226; AZURE &#8226; SERVICENOW</text>

<!-- animated divider -->
<line x1="92" y1="322" x2="1050" y2="322" stroke="#1c2c42" stroke-width="2"/>
<line x1="92" y1="322" x2="1050" y2="322" stroke="url(#sweepGrad)" stroke-width="2"/>

<!-- tagline card -->
<rect x="90" y="345" width="52" height="52" rx="10" fill="none" stroke="#2a3b56" stroke-width="1.5"/>
<text x="107" y="378" font-size="20" fill="#58a6ff" class="mono">&lt;/&gt;</text>
<text x="164" y="368" font-size="19" fill="#c9d1d9">Building efficient solutions through <tspan fill="#58a6ff">automation,</tspan></text>
<text x="164" y="394" font-size="19" fill="#c9d1d9"><tspan fill="#58a6ff">data</tspan> and enterprise IT support.</text>

<!-- code panel (right column, upper) -->
<g class="mono" font-size="16">
  <text x="1090" y="120" fill="#c586c0">def</text>
  <text x="1130" y="120" fill="#dcdcaa">solve_problems</text>
  <text x="1257" y="120" fill="#d4d4d4">():</text>

  <text x="1115" y="147" fill="#c586c0">while</text>
  <text x="1177" y="147" fill="#569cd6">True</text>
  <text x="1225" y="147" fill="#d4d4d4">:</text>

  <text x="1140" y="174" fill="#dcdcaa">learn</text>
  <text x="1195" y="174" fill="#d4d4d4">()</text>
  <text x="1140" y="201" fill="#dcdcaa">build</text>
  <text x="1195" y="201" fill="#d4d4d4">()</text>
  <text x="1140" y="228" fill="#dcdcaa">improve</text>
  <text x="1225" y="228" fill="#d4d4d4">()</text>

  <text x="1115" y="266" fill="#9cdcfe">impact</text>
  <text x="1195" y="266" fill="#d4d4d4">=</text>
  <text x="1215" y="266" fill="#dcdcaa">results</text>
  <text x="1285" y="266" fill="#d4d4d4">()</text>

  <text x="1115" y="293" fill="#dcdcaa">print</text>
  <text x="1165" y="293" fill="#d4d4d4">(</text>
  <text x="1175" y="293" fill="#ce9178">"Shipping value, every day."</text>
  <text x="1380" y="293" fill="#d4d4d4">)</text>
  <rect x="1390" y="280" width="9" height="15" fill="#58a6ff" class="cursor"/>
</g>

<!-- technology badges row -->
<g class="badge" style="animation-delay:.1s">
  <rect x="1090" y="345" width="64" height="64" rx="14" fill="#0d1b2e" stroke="#26456e" stroke-width="1.5"/>
  <circle cx="1113" cy="368" r="7" fill="#3b82f6"/>
  <circle cx="1129" cy="386" r="7" fill="#facc15"/>
  <text x="1093" y="428" font-size="12" fill="#8b949e" letter-spacing="1">PYTHON</text>
</g>

<g class="badge" style="animation-delay:.2s">
  <rect x="1170" y="345" width="64" height="64" rx="14" fill="#0d1b2e" stroke="#26456e" stroke-width="1.5"/>
  <path d="M1186,368 v18 a16,6 0 0 0 32,0 v-18" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <ellipse cx="1202" cy="368" rx="16" ry="6" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="1193" y="428" font-size="12" fill="#8b949e" letter-spacing="1">SQL</text>
</g>

<g class="badge" style="animation-delay:.3s">
  <rect x="1250" y="345" width="64" height="64" rx="14" fill="#0d1b2e" stroke="#26456e" stroke-width="1.5"/>
  <rect x="1266" y="384" width="7" height="10" fill="#f2c811"/>
  <rect x="1277" y="374" width="7" height="20" fill="#f2c811"/>
  <rect x="1288" y="362" width="7" height="32" fill="#f2c811"/>
  <text x="1249" y="428" font-size="11" fill="#8b949e" letter-spacing="1">POWER BI</text>
</g>

<g class="badge" style="animation-delay:.4s">
  <rect x="1330" y="345" width="64" height="64" rx="14" fill="#0d1b2e" stroke="#26456e" stroke-width="1.5"/>
  <rect x="1347" y="362" width="12" height="12" fill="#f25022"/>
  <rect x="1361" y="362" width="12" height="12" fill="#7fba00"/>
  <rect x="1347" y="376" width="12" height="12" fill="#00a4ef"/>
  <rect x="1361" y="376" width="12" height="12" fill="#ffb900"/>
  <text x="1316" y="428" font-size="10.5" fill="#8b949e" letter-spacing="1">MICROSOFT 365</text>
</g>

<g class="badge" style="animation-delay:.5s">
  <rect x="1410" y="345" width="64" height="64" rx="14" fill="#0d1b2e" stroke="#26456e" stroke-width="1.5"/>
  <path d="M1442,360 l16,36 h-12 l-4,-11 -9,11 h-10 z" fill="#0078d4"/>
  <text x="1417" y="428" font-size="12" fill="#8b949e" letter-spacing="1">AZURE</text>
</g>

<g class="badge" style="animation-delay:.6s">
  <rect x="1490" y="345" width="64" height="64" rx="14" fill="#0d1b2e" stroke="#26456e" stroke-width="1.5"/>
  <text x="1522" y="386" font-size="22" font-weight="700" fill="#62d84e" text-anchor="middle">n</text>
  <text x="1466" y="428" font-size="10.5" fill="#8b949e" letter-spacing="1">SERVICENOW</text>
</g>

<!-- stats bar -->
<rect x="90" y="460" width="1404" height="72" rx="14" fill="#0a1424" stroke="#1c3050" stroke-width="1.5"/>

<g class="mono">
  <text x="122" y="492" font-size="24" font-weight="800" fill="#58a6ff">3+</text>
  <text x="122" y="514" font-size="12.5" fill="#8b949e">YEARS OF EXPERIENCE</text>

  <line x1="365" y1="474" x2="365" y2="518" stroke="#1c3050"/>
  <circle cx="410" cy="490" r="11" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
  <path d="M405,490 l4,4 8,-9" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="435" y="494" font-size="15" font-weight="700" fill="#e6edf3">ENTERPRISE</text>
  <text x="435" y="514" font-size="12.5" fill="#8b949e">ENVIRONMENTS</text>

  <line x1="655" y1="474" x2="655" y2="518" stroke="#1c3050"/>
  <circle cx="700" cy="492" r="12" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
  <line x1="700" y1="492" x2="700" y2="483" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="700" y1="492" x2="707" y2="492" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="725" y="494" font-size="15" font-weight="700" fill="#e6edf3">SLA</text>
  <text x="725" y="514" font-size="12.5" fill="#8b949e">MANAGEMENT</text>

  <line x1="900" y1="474" x2="900" y2="518" stroke="#1c3050"/>
  <circle cx="938" cy="486" r="6" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
  <circle cx="954" cy="486" r="6" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
  <path d="M928,502 q10,-12 20,0" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
  <path d="M944,502 q10,-12 20,0" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="975" y="494" font-size="15" font-weight="700" fill="#e6edf3">IT SUPPORT</text>
  <text x="975" y="514" font-size="12.5" fill="#8b949e">LEVEL 2</text>

  <line x1="1195" y1="474" x2="1195" y2="518" stroke="#1c3050"/>
  <polyline points="1232,504 1245,490 1256,498 1272,480" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="1264,480 1272,480 1272,488" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1290" y="494" font-size="15" font-weight="700" fill="#e6edf3">AUTOMATION</text>
  <text x="1290" y="514" font-size="12.5" fill="#8b949e">FOCUSED</text>
</g>

<!-- bottom loader line -->
<g class="mono" font-size="15">
  <text x="90" y="590" fill="#58a6ff">&gt;</text>
  <text x="106" y="590" fill="#8b949e">loading_skills.exe</text>
  <rect x="290" y="578" width="230" height="12" rx="6" fill="#111a2c" stroke="#1c3050"/>
  <rect x="290" y="578" width="0" height="12" rx="6" fill="url(#barFill)">
    <animate attributeName="width" from="0" to="230" dur="2.2s" fill="freeze"/>
  </rect>
  <text x="535" y="590" fill="#58a6ff" font-weight="700">100%</text>

  <text x="1230" y="590" fill="#58a6ff">&gt;</text>
  <text x="1246" y="590" fill="#8b949e">ready_for_new_challenges</text>
  <rect x="1462" y="577" width="9" height="16" fill="#58a6ff" class="cursor"/>
</g>

</svg>
